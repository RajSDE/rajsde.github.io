name: Build Angular (DEV)

on:
  push:
    branches: ["DEV"]

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rajsde-portfolio/package-lock.json

      - name: Install Dependencies
        working-directory: ./rajsde-portfolio
        run: npm ci

      - name: Build Check
        working-directory: ./rajsde-portfolio
        # This compiles the app to check for errors but does not deploy
        run: npm run build -- --configuration production --base-href /