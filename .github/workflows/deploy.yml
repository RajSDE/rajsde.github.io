name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["RELEASE"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rajsde-portfolio/package-lock.json

      - name: Install Dependencies
        working-directory: ./rajsde-portfolio
        run: npm ci

      - name: Build
        working-directory: ./rajsde-portfolio
        run: npm run build -- --configuration production --base-href /

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: rajsde-portfolio/dist/rajsde-portfolio/browser
          branch: gh-pages