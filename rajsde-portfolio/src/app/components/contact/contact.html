<section id="contact" class="section-padding bg-dark text-white">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center fade-in">
                <div class="mb-5">
                    <h2 class="text-white fw-bold mb-3">Ready to Scale Your Infrastructure?</h2>
                    <p class="text-white-50" style="max-width: 600px; margin: 0 auto;">
                        I am currently accepting new freelance projects.
                    </p>
                </div>

                <div class="contact-card p-4 p-md-5">
                    <div class="mb-4 text-primary">
                        <i class="fas fa-envelope-open-text" style="font-size: 3.5rem;"></i>
                    </div>

                    <h3 class="text-white fw-bold mb-3">Let's Discuss Your Project</h3>
                    <p class="text-white-50 mb-4">Send me your requirements or book a consultation call.</p>

                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                        <a [href]="'mailto:' + settings.email" class="btn-modern btn-primary-modern btn-lg px-5">
                            <i class="fas fa-envelope me-2"></i>Email Me
                        </a>
                    </div>

                    <div class="mt-5 social-links">
                        <a [href]="settings.linkedinProfile" class="text-white-50 hover-white"><i class="fab fa-linkedin fa-lg"></i></a>
                        <a [href]="settings.githubProfile" class="text-white-50 hover-white"><i class="fab fa-github fa-lg"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
