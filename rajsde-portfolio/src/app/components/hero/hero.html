<section class="hero-section">
    <div class="container">
        <div class="row align-items-center min-vh-100 py-5 py-lg-0 mt-lg-5">
            <div class="col-lg-7 hero-content">
                <h1 class="hero-title fade-in">{{ settings.heroTitle }}</h1>
                <p class="hero-subtitle fade-in">{{ settings.heroSubtitle }}</p>
                <p class="hero-description fade-in">{{ settings.heroDescription }}</p>
                
                <div class="fade-in d-flex flex-column flex-sm-row justify-content-center justify-content-lg-start gap-3">
                    <a href="#contact" class="btn-modern btn-primary-modern text-nowrap">
                        <i class="fas fa-paper-plane me-2"></i>Start a Project
                    </a>
                    <a href="#services" class="btn-modern btn-outline-modern text-nowrap">
                        <i class="fas fa-layer-group me-2"></i>View Services
                    </a>
                </div>
            </div>

            <div class="col-lg-5 text-center fade-in d-none d-lg-block">
                <div class="linkedin-badge-wrapper desktop-view">
                    <div class="badge-base LI-profile-badge" 
                         data-locale="en_US" 
                         data-size="large"
                         data-theme="light" 
                         data-type="HORIZONTAL" 
                         [attr.data-vanity]="'rajsde'" 
                         data-version="v1">
                        <a class="badge-base__link LI-simple-link"
                           [href]="settings.linkedinProfile + '?trk=profile-badge'"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
